
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Employee Management System</h1>
        <p>Manage your employees easily</p>
    </header>

    <main>
        <section class="dashboard">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <p id="totalEmployees">0</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Add Employee</h2>

            <form id="employeeForm">
                <input type="hidden" id="editId">

                <label for="name">Employee Name</label>
                <input type="text" id="name" placeholder="Enter employee name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email" required>

                <label for="department">Department</label>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                </select>

                <label for="designation">Designation</label>
                <input type="text" id="designation" placeholder="e.g. Software Developer" required>

                <label for="salary">Salary (₹)</label>
                <input type="number" id="salary" placeholder="Enter salary" min="1" required>

                <button type="submit" id="submitButton">Add Employee</button>
            </form>
        </section>

        <section class="employee-section">
            <h2>Employee Records</h2>

            <input type="text" id="searchInput" placeholder="Search employee by name...">

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTable">
                        <!-- Employee records will appear here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Employee Management System | College Mini Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
